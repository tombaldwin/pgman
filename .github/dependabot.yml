version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Its refs name a Rust toolchain (stable, 1.94.1 = the MSRV),
      # not a version of the action. Dependabot reads them as versions
      # and proposes toolchains that don't exist; bump these by hand.
      - dependency-name: dtolnay/rust-toolchain
