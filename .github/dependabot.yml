version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Pinned to a master commit with the toolchain passed as
      # `toolchain:`; its refs name Rust toolchains, not versions of the
      # action, so Dependabot proposes toolchains that don't exist.
      # Bump the commit by hand.
      - dependency-name: dtolnay/rust-toolchain
