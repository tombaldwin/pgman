name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege for every job below. Without an explicit block a job
# inherits the repository default, which can be write-all — CodeQL flags
# each one (`actions/missing-workflow-permissions`). Nothing in CI needs
# more than reading the checkout.
permissions:
  contents: read

jobs:
  # Unit + doc + render + subprocess tests on both OSes. No Postgres
  # needed.
  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --tests
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      # Compile (don't run) the DB-gated integration tests on every push
      # and both OSes, so a signature change can't silently rot them
      # the way it did once before. The `integration` job below actually
      # runs them against Postgres, but only on Linux.
      - run: cargo check --locked --all-targets --features integration

  # Integration tests against a real Postgres: the same compose file as
  # local runs, a primary and a streaming standby of it. Linux only —
  # macOS runners have no docker.
  integration:
    name: cargo test --features integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: docker compose -f docker-compose.test.yml up -d --wait
      # The dump / restore tests run the runner's own PostgreSQL client;
      # fail here, by name, if the image stops shipping it (the tests
      # also refuse to skip under CI).
      - run: pg_dump --version && pg_restore --version
      - run: cargo test --features integration --test integration
      # The library's own DB-backed tests (`cfg(all(test, feature =
      # "integration"))` — a real App against the compose database, as in
      # src/app/edit_cell.rs): `--test integration` alone never runs them.
      - run: cargo test --locked --features integration --lib

  # Coverage report via cargo-llvm-cov. Posts the summary to the run
  # log; the lcov artifact is uploadable to Codecov or similar.
  coverage:
    name: coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - run: cargo llvm-cov report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PINNED, not @stable. A floating stable ships new lints/format
      # rules and can redden main on a commit that changed nothing here.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PINNED, not @stable. A floating stable ships new lints and can
      # redden main on a commit that changed nothing here.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  # MSRV gate: build AND test on the minimum supported Rust version.
  # Build alone would let a test-only API that doesn't exist on the
  # MSRV slip past the gate.
  msrv:
    name: msrv (rust 1.94.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - run: cargo test --locked

  # Unused-dependency gate.
  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit, not @main. This is a required gate: on a
      # moving branch it can break, or be subverted, underfoot.
      - uses: bnjbvr/cargo-machete@fb7ff0f4aa2a60cf75ab656d27f67d47d719b830

  # Supply-chain gate: security advisories, license allow-list, bans,
  # and source provenance, per deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Architecture gate: direct database access (the Db effect) must stay in the data layer
  # (src/conn.rs + src/query/). A UI/app function reaching the DB directly fails the job.
  # Enforced with candor's stable scanner (no nightly). See .candor/policy + ci/candor-check.sh.
  candor:
    name: candor (DB boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install candor-scan
        # PINNED deliberately. Unversioned, this gate moves underfoot: a
        # newer scanner classifies the same source differently, so the job
        # can go red on a commit that changed no code at all. That happened
        # in the sibling tb-tui-common repo — passed in June, failed in
        # August on a dependency-only commit. A required gate you cannot
        # reason about is worse than no gate. Bump this on purpose, having
        # re-run `bash ci/candor-check.sh .` against the new version first.
        run: cargo install candor-scan --locked --version 0.31.0
      - name: enforce DB-access boundary (Db only in conn.rs + query/)
        run: bash ci/candor-check.sh
