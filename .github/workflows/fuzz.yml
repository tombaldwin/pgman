name: Fuzz

# The parsers that read what pgman doesn't control — DSNs, SQL for the
# safety classifier and the lexer, Hibernate and Postgres logs, a
# project's .pgman/pgman.toml — fuzzed for two minutes each, weekly and on
# demand. A crash fails the job; its input is in the log
# (fuzz/artifacts/<target>/ in a local run).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - dsn_parse
          - tokenize
          - hibernate_parse
          - pglog_parse
          - project_parse
          - safety_classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Stable builds cargo-fuzz (its locked dependencies don't always
      # build on nightly); nightly, installed last and so the default,
      # builds the targets with the sanitizer flags.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        run: cargo +stable install cargo-fuzz --locked --version 0.13.2
      - name: fuzz ${{ matrix.target }}
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=120
