[package]
name = "pgman"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
authors = ["Tom Baldwin <tom@polymorphism.co.uk>"]
description = "k9s-style Postgres TUI for Java/AWS shops"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tombaldwin/pgman"
homepage = "https://github.com/tombaldwin/pgman"
keywords = ["postgresql", "tui", "database", "cli", "ratatui"]
categories = ["command-line-utilities", "database"]
# Keep the published crate to source + the docs cargo needs (README for
# the crates.io page, CHANGELOG for a build script to read). An
# allow-list, not an exclude-list: `exclude` only stops naming things
# that happen to exist today, so PLAN.md, BACKLOG.md, CLAUDE.md, docs/,
# the whole test tree and CI config were all shipping in the tarball
# (verify with `cargo package --list`). `tests/` is dropped entirely —
# crates.io users don't run the test suite, and it drags in
# `tests/bin/` shell scripts — not just excluded from an exclude-list
# that would need updating every time a new top-level dir appears.
include = [
    "src/**",
    "benches/hot_paths.rs",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "demo.gif",
]

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"
rustls = "0.23"
rustls-native-certs = "0.8"
webpki-roots = "1.0"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
quick-xml = "0.42"
# Display-column widths for terminal text (`ui::display_width`). ratatui
# already depends on this exact crate, so it adds no transitive deps —
# `cargo tree -i unicode-width` shows both as the same node.
unicode-width = "0.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
arboard = "3"
# Update check (`src/update_check.rs`): a single crates.io GET, cached
# and rate-limited to at most once every six hours. rustls-tls keeps
# it on the same TLS stack as the Postgres connection path (no extra
# OpenSSL dependency).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Shared TUI helpers (font/Powerline probe, atomic-write, theme
# contrast, overlay sizing) — also depended on by ebman so fixes
# flow between both. Local copies of these used to live under
# src/util.rs and src/font_probe.rs; see `// tui-common: …` notes
# inline where the migration replaced them.
tui-common = { package = "tb-tui-common", version = "0.2" }

# Deferred — added as the milestones that need them land (see BACKLOG.md):
#   M2  deadpool-postgres                      — connection pool for interactive queries
#   M1.5 serde_yaml                            — creds/spring.rs application.yml
#   v2  aws-config, aws-sdk-rds,               — discover_aws.rs, rds_logs.rs,
#       aws-sdk-cloudwatch, aws-sdk-cloudwatchlogs, mode_params.rs, mode_dashboard.rs
#       aws-sdk-ssm, aws-sdk-secretsmanager    — creds/{ssm,secrets}.rs

[features]
# Tests that need a live Postgres (docker-compose.test.yml). Off by
# default so a plain `cargo test` doesn't hang waiting for a server.
# CI / local: `docker compose -f docker-compose.test.yml up -d` and
# then `cargo test --features integration`.
integration = []

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
insta = "1"
proptest = "1"

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Smaller/faster release binary: no unwind tables to build or walk. Safe
# here because src/tui.rs's panic hook only uses `set_hook` (no
# `catch_unwind`), so terminal restore on panic is unaffected.
panic = "abort"

# Local co-development of tb-tui-common: uncomment to build against a
# sibling checkout instead of crates.io. Leave commented in git.
# [patch.crates-io]
# tb-tui-common = { path = "../tb-tui-common" }
