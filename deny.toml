# cargo-deny configuration — keeps the dependency tree permissive-licensed
# and advisory-clean. Run locally with `cargo deny check` (cargo install
# cargo-deny). Wired into CI as a blocking check (docs/development.md).

[advisories]
version = 2
# Fail on security advisories; review unmaintained crates manually.
yanked = "deny"
ignore = [
    # Unmaintained, build-time only: the `age` crate's i18n-embed-fl
    # proc-macro reads its translations with basic-toml. No runtime code,
    # no input of ours; age has used it in every release. Decided by Tom,
    # 2026-11-02, with age pinned at 0.11 (0.12 adds p256 and a timing
    # advisory in crypto-bigint). Revisit when age drops i18n-embed-fl.
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: build-time, via age's i18n proc-macro" },
    # Unmaintained, build-time only: proc-macro-error2, pulled by age
    # 0.11's i18n proc-macro. Same decision, same revisit.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: build-time, via age's i18n proc-macro" },
]

[licenses]
version = 2
# pgman is MIT OR Apache-2.0; only allow permissive licenses in the tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Boost Software License — OSI-approved, FSF Free/Libre, permissive
    # (no attribution required for binaries). Via arboard → clipboard-win.
    "BSL-1.0",
    # Community Data License Agreement (permissive) — covers the bundled
    # CA-root *data* in webpki-roots, not code. Permissive, attribution-only.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
