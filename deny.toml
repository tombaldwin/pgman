# cargo-deny configuration — keeps the dependency tree permissive-licensed
# and advisory-clean. Run locally with `cargo deny check` (cargo install
# cargo-deny). Wired into CI as a non-blocking-to-start check.

[advisories]
version = 2
# Fail on security advisories; review unmaintained crates manually.
yanked = "deny"

[licenses]
version = 2
# pgman is MIT OR Apache-2.0; only allow permissive licenses in the tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
