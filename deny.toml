# cargo-deny configuration — keeps the dependency tree permissive-licensed
# and advisory-clean. Run locally with `cargo deny check` (cargo install
# cargo-deny). Wired into CI as a non-blocking-to-start check.

[advisories]
version = 2
# Fail on security advisories; review unmaintained crates manually.
yanked = "deny"
ignore = [
    # `paste` is archived/unmaintained but stable; it's a transitive,
    # compile-time-only proc-macro helper pulled in by ratatui, with no
    # safe upgrade available. Not a vulnerability — revisit when ratatui
    # drops or replaces it.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# pgman is MIT OR Apache-2.0; only allow permissive licenses in the tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    # Boost Software License — OSI-approved, FSF Free/Libre, permissive
    # (no attribution required for binaries). Via arboard → clipboard-win.
    "BSL-1.0",
    # Community Data License Agreement (permissive) — covers the bundled
    # CA-root *data* in webpki-roots, not code. Permissive, attribution-only.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
