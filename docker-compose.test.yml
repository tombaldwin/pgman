# Postgres for integration tests, locally and in CI: a primary on
# 127.0.0.1:55432 and a streaming standby of it on 127.0.0.1:55433.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down
#
# Non-standard host ports so it doesn't clash with a developer's local
# postgres. Nothing persists: each `up` after a `down` starts empty.
services:
  postgres:
    image: postgres:16
    # Docker's 64 MB /dev/shm can be too little for parallel query under
    # the parallel suite: a backend that can't map its segment dies of
    # SIGBUS and takes the server into recovery (the likely cause of one
    # CI crash, not shown; CI prints the server's log on failure).
    shm_size: 512mb
    environment:
      POSTGRES_PASSWORD: pgman_test
      POSTGRES_USER: pgman_test
      POSTGRES_DB: pgman_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./ci/initdb-replication.sh:/docker-entrypoint-initdb.d/replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgman_test -d pgman_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  # A hot standby: a base backup of the primary, then streaming
  # replication. What the replica, lag and standby-refusal tests run on.
  standby:
    image: postgres:16
    shm_size: 512mb
    depends_on:
      postgres:
        condition: service_healthy
    user: postgres
    entrypoint:
      - bash
      - -c
      - >-
        rm -rf /tmp/standby &&
        pg_basebackup -d 'host=postgres user=pgman_test password=pgman_test'
        -D /tmp/standby -R -X stream -c fast &&
        chmod 700 /tmp/standby &&
        exec postgres -D /tmp/standby
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pgman_test -d pgman_test"]
      interval: 1s
      timeout: 3s
      retries: 60
