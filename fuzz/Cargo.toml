[package]
name = "pgman-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pgman = { path = ".." }

# Stop the main crate's fuzz targets from being depended on by the
# main build; this subcrate is its own world.
[workspace]

[[bin]]
name = "dsn_parse"
path = "fuzz_targets/dsn_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenize"
path = "fuzz_targets/tokenize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hibernate_parse"
path = "fuzz_targets/hibernate_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pglog_parse"
path = "fuzz_targets/pglog_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_parse"
path = "fuzz_targets/project_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safety_classify"
path = "fuzz_targets/safety_classify.rs"
test = false
doc = false
bench = false
